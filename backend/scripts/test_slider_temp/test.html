
<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 20px; font-family: sans-serif; background: #0f172a; color: white; }
  .carousel-wrapper { width: 800px; overflow: hidden; border: 2px solid #eab308; margin-bottom: 20px; }
  .carousel-track { display: flex; transition: transform 0.5s ease; will-change: transform; }
  .card { width: 25%; flex-shrink: 0; height: 120px; box-sizing: border-box; padding: 10px; }
  .inner { background: #1e293b; border: 1px solid #475569; border-radius: 8px; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; }
</style>
</head>
<body>
  <h1>RTL Carousel Test (Chrome)</h1>
  <div class="carousel-wrapper">
    <div id="track" class="carousel-track">
      <div class="card"><div class="inner" style="color: red;">Card 0</div></div>
      <div class="card"><div class="inner" style="color: orange;">Card 1</div></div>
      <div class="card"><div class="inner" style="color: yellow;">Card 2</div></div>
      <div class="card"><div class="inner" style="color: green;">Card 3</div></div>
      <div class="card"><div class="inner" style="color: cyan;">Card 4</div></div>
      <div class="card"><div class="inner" style="color: blue;">Card 5</div></div>
      <div class="card"><div class="inner" style="color: magenta;">Card 6</div></div>
      <div class="card"><div class="inner" style="color: white;">Card 7</div></div>
    </div>
  </div>
  <div id="status">Testing...</div>

  <script>
    const track = document.getElementById('track');
    const status = document.getElementById('status');
    let idx = 0;
    setInterval(() => {
      idx = (idx + 1) % 5;
      // In RTL, does translateX(+25% * idx) reveal Card 4, 5, 6?
      track.style.transform = 'translateX(' + (idx * 25) + '%)';
      const visibleCards = [];
      document.querySelectorAll('.card').forEach((c, i) => {
        const r = c.getBoundingClientRect();
        if (r.left >= 10 && r.right <= 830) {
          visibleCards.push(i);
        }
      });
      status.innerText = 'Index: ' + idx + ', transform: ' + track.style.transform + ', Visible cards: ' + visibleCards.join(', ');
    }, 500);
  </script>
</body>
</html>
